; ESP32-S3 N16R8 + Bruce - Flipper tu che (CC1101 + PN532 + TFT 1.44 ST7735 + microSD + IR + buzzer)

[env:esp32s3-flipper]
board = esp32s3-flipper
board_build.arduino.memory_type = qio_opi ; N16R8: flash QIO 16MB, PSRAM OPI 8MB
board_build.partitions = custom_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/esp32s3-flipper>
build_flags =
	${env.build_flags}
	-Iboards/esp32s3-flipper
	-DCORE_DEBUG_LEVEL=1
	-DDEVICE_NAME='"ESP32-S3 Flipper"'
	-DIR_TX_PINS='{{"IR TX", TXLED}}'
	-DIR_RX_PINS='{{"IR RX", RXLED}}'
	-DRF_TX_PINS='{{"CC1101", CC1101_GDO0_PIN}}'
	-DRF_RX_PINS='{{"CC1101", CC1101_GDO0_PIN}}'
	; Man TFT 1.44" ST7735 128x128 (SPI dung chung voi CC1101/microSD/NRF24), doi GREENTAB3 thanh GREENTAB/GREENTAB2/REDTAB neu bi lech hinh
	-DUSER_SETUP_LOADED=1
	-DST7735_DRIVER=1
	-DST7735_GREENTAB3
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_WIDTH=128
	-DTFT_HEIGHT=128
	-DTFT_MISO=13
	-DTFT_MOSI=11
	-DTFT_SCLK=12
	-DTFT_CS=5
	-DTFT_DC=7
	-DTFT_RST=-1
	-DTFT_BL=-1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=27000000
	-DSPI_READ_FREQUENCY=16000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DTOUCH_CS=-1
build_src_flags =
	${env.build_src_flags}
	-DFP=1
	-DFM=1
	-DFG=2
lib_deps =
	${env.lib_deps}
